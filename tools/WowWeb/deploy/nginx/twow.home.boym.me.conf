# Reverse proxy for the account website, so the game client can open its links
# by name.
#
# Install as /etc/nginx/conf.d/twow.home.boym.me.conf (or in sites-available
# with a symlink), then:
#
#     nginx -t && systemctl reload nginx
#
# ---------------------------------------------------------------------------
# Why port 80, and why a name at all
# ---------------------------------------------------------------------------
# The client opens a link through the Lua function LaunchURL, which refuses any
# address that is not plain http:// with no port - a colon anywhere after the
# scheme makes it ignore the click silently. Before opening anything it also
# checks the host against a whitelist compiled into WoW.exe.
#
# So a link the client can actually use is shaped exactly like this:
#
#     http://twow.home.boym.me/notice
#
# A name, port 80, no query string. Two consequences:
#
#   * whatever DNS answers for twow.home.boym.me has to reach this server
#   * the name has to be added to the executable's whitelist, which is what
#     tools/ClientPatch/patch_urllist.py does
#
# The announcement's own address (SERVER_ALERT_URL) is fetched by a different
# code path and may carry a port, but pointing it at this same origin keeps one
# name in one place.
#
# ---------------------------------------------------------------------------
# Adding TLS later
# ---------------------------------------------------------------------------
# A redirect is fine for anything a *browser* opens, and that is everything
# except one location:
#
#   /alert is fetched by the game client itself, through its own HTTP stack. It
#   is not a browser: nobody follows a redirect for it, so a 302 there means the
#   login-screen panel silently goes blank. Leave /alert on plain HTTP.
#
# Everything else may redirect - the client's links are opened by the browser,
# after the client has already validated the address and written it into a
# temporary Internet Shortcut. The client never sees the redirect.
#
# One nginx trap: `return 301` at *server* level runs in the server-rewrite
# phase, which happens BEFORE a location is chosen, so it would redirect /alert
# too and bypass the exception below. Scope the redirect inside a location:
#
#     location / {
#         return 301 https://$host$request_uri;
#     }
#     location = /alert {
#         proxy_pass http://172.18.1.6:8080;   # exact match wins, stays HTTP
#     }
#
# With TLS in place for browsers, also set SESSION_SECURE=true for the app.
# ---------------------------------------------------------------------------

server {
    listen      80;
    listen      [::]:80;
    server_name twow.home.boym.me;

    access_log  /var/log/nginx/twow.home.boym.me.access.log;
    error_log   /var/log/nginx/twow.home.boym.me.error.log;

    # Nothing here accepts an upload; the login form is a few hundred bytes.
    client_max_body_size 64k;

    # The app sends Cache-Control: no-store on the notice so an edit shows up on
    # the next login screen. This keeps a transparent proxy from second-guessing
    # that and handing the client a stale panel.
    proxy_cache off;

    # The game client fetches this one itself, as soon as the login screen is
    # drawn. It is not a browser: it has no gzip support on this path and no
    # tolerance for a rewritten body, so the response has to arrive byte for
    # byte as the app wrote it - including the SERVERALERT: prefix it looks for.
    location = /alert {
        gzip off;
        proxy_pass http://172.18.1.6:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # For monitoring, and kept out of the access log so it does not bury real
    # requests.
    location = /healthz {
        access_log off;
        proxy_pass http://172.18.1.6:8080;
    }

    location / {
        proxy_pass http://172.18.1.6:8080;
        proxy_http_version 1.1;

        # The app honours these headers only with WEB_TRUST_PROXY=1. Set it, or
        # every player arrives from this proxy's address: the logs stop telling
        # players apart, and the sign-in throttle puts them all in one bucket,
        # so one person fat-fingering a password locks out everyone.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }
}
