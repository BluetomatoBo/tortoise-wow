{{define "content"}}
<section class="card narrow">
  <h1>{{.T "passwd.title"}}</h1>
  <p class="muted">{{.T "passwd.hint"}}</p>

  <form method="post" action="/panel/password">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label>{{.T "passwd.current"}}
      <input type="password" name="current_password" autocomplete="current-password" required autofocus>
    </label>
    <label>{{.T "passwd.new"}}
      <input type="password" name="new_password" autocomplete="new-password"
             minlength="{{.Config.PasswordMinLen}}" maxlength="16" required>
      <small class="muted">{{printf (.T "passwd.newHint") .Config.PasswordMinLen}}</small>
    </label>
    <label>{{.T "passwd.repeat"}}
      <input type="password" name="new_password2" autocomplete="new-password"
             minlength="{{.Config.PasswordMinLen}}" maxlength="16" required>
    </label>
    <button class="btn" type="submit">{{.T "passwd.submit"}}</button>
  </form>

  <p class="muted"><a href="/panel">&larr; {{.T "passwd.back"}}</a></p>
</section>
{{end}}
